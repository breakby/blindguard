<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>BlindGuard</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#v,#o{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#s{position:absolute;left:0;right:0;bottom:0;padding:16px;font-size:20px;background:#000a}
#b{position:absolute;inset:0;margin:auto;width:80%;height:30%;font-size:30px;border-radius:24px;border:0;background:#2e7d32;color:#fff}
</style></head><body>
<video id="v" playsinline muted></video><canvas id="o"></canvas>
<div id="s">시작 버튼을 눌러주세요</div>
<button id="b" aria-label="안내 시작">시작</button>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.min.js"></script>
<script>
const $=id=>document.getElementById(id), S=320; // 모델 입력 크기 (imgsz=320 으로 변환할 것)
const F=+(new URLSearchParams(location.search).get('f')||0.74); // 거리 보정값: 주소 뒤에 ?f=0.8 처럼 조정
const NAMES="person,bicycle,car,motorcycle,airplane,bus,train,truck,boat,traffic light,fire hydrant,stop sign,parking meter,bench,bird,cat,dog,horse,sheep,cow,elephant,bear,zebra,giraffe,backpack,umbrella,handbag,tie,suitcase,frisbee,skis,snowboard,sports ball,kite,baseball bat,baseball glove,skateboard,surfboard,tennis racket,bottle,wine glass,cup,fork,knife,spoon,bowl,banana,apple,sandwich,orange,broccoli,carrot,hot dog,pizza,donut,cake,chair,couch,potted plant,bed,dining table,toilet,tv,laptop,mouse,remote,keyboard,cell phone,microwave,oven,toaster,sink,refrigerator,book,clock,vase,scissors,teddy bear,hair drier,toothbrush".split(",");
const WIDTH={person:.45,bicycle:.6,motorcycle:.8,car:1.8,bus:2.5,truck:2.5,dog:.3};
const HEIGHT={person:1.7,bicycle:1.1,motorcycle:1.3,car:1.5,bus:3,truck:3,dog:.5};
const KO={person:"사람",bicycle:"자전거",motorcycle:"오토바이",car:"자동차",bus:"버스",truck:"트럭",dog:"강아지"};
const VEH=["car","bus","truck","motorcycle","bicycle"];
const vid=$('v'),ov=$('o'),oc=ov.getContext('2d'),st=$('s');
const c=document.createElement('canvas');c.width=c.height=S;const cx=c.getContext('2d',{willReadFrequently:true});
let sess,actx;

// ---------- 음성 / 경고음 ----------
function say(t){ if(speechSynthesis.speaking)return; speak(t); }
function speak(t){ st.textContent=t; const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=1.15;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-')==='ko-KR'); if(v)u.voice=v; speechSynthesis.speak(u); }
function alertNow(t){ speechSynthesis.cancel(); beep(); speak(t); }  // 모든 안내를 끊고 최우선 경고
function beep(){ if(!actx)return; for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=1000;
  g.gain.value=.6;o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+i*.15);o.stop(actx.currentTime+i*.15+.1);} }

// ---------- 탐지 ----------
function iou(a,b){const w=Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1),h=Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1);
  if(w<=0||h<=0)return 0;const i=w*h;return i/((a.x2-a.x1)*(a.y2-a.y1)+(b.x2-b.x1)*(b.y2-b.y1)-i);}
function decode(d,dims){const R=dims[1],N=dims[2],res=[];
  for(let i=0;i<N;i++){let bs=0,bc=0;for(let k=4;k<R;k++){const s=d[k*N+i];if(s>bs){bs=s;bc=k-4;}}
    if(bs<.4)continue;const x=d[i]/S,y=d[N+i]/S,w=d[2*N+i]/S,h=d[3*N+i]/S;
    res.push({l:NAMES[bc],s:bs,x1:Math.max(0,x-w/2),y1:Math.max(0,y-h/2),x2:Math.min(1,x+w/2),y2:Math.min(1,y+h/2)});}
  const keep=[];for(const a of res.sort((p,q)=>q.s-p.s))if(!keep.some(k=>k.l===a.l&&iou(k,a)>.5))keep.push(a);return keep;}

// ---------- 판단 (Android Guardian 과 동일) ----------
let tracks=[],said={},crossSeen=0,lastLight='',lastLightT=0;
const thr=(k,n,ms)=>{if(n-(said[k]||0)<ms)return false;said[k]=n;return true;};
const ga=s=>((s.charCodeAt(s.length-1)-0xAC00)%28===0)?'가':'이';
const dir=x=>x<.35?'왼쪽':x>.65?'오른쪽':'정면';
const speedOf=t=>{if(t.h.length<3)return 0;const a=t.h[0],b=t.h[t.h.length-1];return (a[1]-b[1])/(Math.max(1,b[0]-a[0])/1000);};
function lightColor(b){const vw=vid.videoWidth,vh=vid.videoHeight,w=Math.max(4,Math.round((b.x2-b.x1)*vw)),h=Math.max(4,Math.round((b.y2-b.y1)*vh));
  const t=document.createElement('canvas');t.width=w;t.height=h;const g=t.getContext('2d');
  g.drawImage(vid,b.x1*vw,b.y1*vh,(b.x2-b.x1)*vw,(b.y2-b.y1)*vh,0,0,w,h);const d=g.getImageData(0,0,w,h).data;let r=0,gr=0,y=0;
  for(let i=0;i<d.length;i+=8){const R=d[i]/255,G=d[i+1]/255,B=d[i+2]/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),df=mx-mn;
    if(mx<.6||df/mx<.5)continue;let H=mx===R?60*(((G-B)/df)%6):mx===G?60*((B-R)/df+2):60*((R-G)/df+4);if(H<0)H+=360;
    if(H<20||H>340)r++;else if(H>=25&&H<=65)y++;else if(H>=80&&H<=180)gr++;}
  return r+gr+y<3?'':(r>=gr&&r>=y)?'빨간불':gr>=y?'초록불':'노란불';}
function guard(dets,now){
  if(dets.some(d=>d.l==='crosswalk'))crossSeen=now;const inCross=now-crossSeen<3000;
  const fh=F*Math.max(vid.videoWidth,vid.videoHeight)/vid.videoHeight, cur=[];
  for(const d of dets){const H=HEIGHT[d.l];if(!H)continue;const bw=d.x2-d.x1,fw=fh*vid.videoHeight/vid.videoWidth;let dist=fh*H/Math.max(.02,d.y2-d.y1);
    if(d.y1<.02||d.y2>.98)dist=Math.min(dist,fw*WIDTH[d.l]/Math.max(.02,bw)); // 화면 밖으로 잘렸으면 폭으로 다시 계산
    let t=tracks.filter(t=>t.l===d.l).sort((a,b)=>iou(b.b,d)-iou(a.b,d))[0];if(!t||iou(t.b,d)<.25){t={l:d.l,h:[]};tracks.push(t);}
    t.b=d;t.h.push([now,dist]);while(t.h.length&&now-t.h[0][0]>1000)t.h.shift();cur.push([t,dist]);}
  tracks=tracks.filter(t=>t.h.length&&now-t.h[t.h.length-1][0]<1000);
  for(const [t,dist] of cur){const v=speedOf(t);if(v<=.1)continue;const ttc=dist/v,ce=t.b.x1<.8&&t.b.x2>.2;let danger=false;
    if(!ce)danger=false;else if(t.l==='dog')danger=v>2.5&&dist<4;
    else if(VEH.includes(t.l)&&inCross)danger=v>9&&ttc<1.5;   // 횡단보도: 정말 빠를 때만
    else if(VEH.includes(t.l))danger=v>3.5&&ttc<2.5&&dist<12;else danger=v>3&&ttc<1.5&&dist<4;
    if(danger&&thr('A'+t.l,now,1500)){const k=KO[t.l];alertNow(`위험! ${dir((t.b.x1+t.b.x2)/2)}에서 ${k}${ga(k)} 빠르게 다가옵니다`);return;}}
  const tl=dets.filter(d=>d.l==='traffic light').sort((a,b)=>(b.x2-b.x1)*(b.y2-b.y1)-(a.x2-a.x1)*(a.y2-a.y1))[0];
  if(tl){const col=lightColor(tl);if(col&&(col!==lastLight||now-lastLightT>6000)){lastLight=col;lastLightT=now;say(`앞의 신호등이 ${col} 입니다`);return;}}
  if(dets.some(d=>d.l==='crosswalk')&&thr('cw',now,12000)){say('앞에 횡단보도가 있습니다');return;}
  for(const [t,dist] of cur.sort((a,b)=>a[1]-b[1]).slice(0,2)){if(dist>10)continue;const k=KO[t.l],d=dir((t.b.x1+t.b.x2)/2);
    if(!thr(k+d,now,4000))continue;say(`${d} ${dist<1?'바로':'약 '+Math.round(dist)+'미터'} 앞에 ${k}${ga(k)} 있습니다`+(speedOf(t)>1?', 다가오고 있습니다':''));return;}
}
function draw(dets){ov.width=vid.videoWidth;ov.height=vid.videoHeight;oc.lineWidth=4;oc.strokeStyle='#0f0';oc.font='28px sans-serif';oc.fillStyle='#0f0';
  for(const d of dets)if(HEIGHT[d.l]||d.l==='traffic light'||d.l==='crosswalk'){const x=d.x1*ov.width,y=d.y1*ov.height;
    oc.strokeRect(x,y,(d.x2-d.x1)*ov.width,(d.y2-d.y1)*ov.height);oc.fillText(KO[d.l]||d.l,x,y-6);}}


// ---------- 장애물 감지 (바닥 연속성 방식: 이름을 몰라도 '막힌 곳'을 찾음) ----------
const CAMH=+(new URLSearchParams(location.search).get('h')||1.2); // 폰 높이(m). 가슴 높이 약 1.2
let obsCnt=0;
function freeSpace(d){
  const G=80,st=S/G,px=(x,y)=>{const i=((y*st)*S+(x*st))*4;return [d[i],d[i+1],d[i+2]];};
  let ref=[0,0,0],n=0;
  for(let y=70;y<77;y++)for(let x=32;x<48;x++){const p=px(x,y);ref[0]+=p[0];ref[1]+=p[1];ref[2]+=p[2];n++;}
  ref=ref.map(v=>v/n);const res={};
  for(const [name,a,b] of [['왼쪽',8,28],['정면',28,52],['오른쪽',52,72]]){let miss=0,stop=null;
    for(let y=77;y>=40;y--){const m=[0,0,0];for(let x=a;x<b;x++){const p=px(x,y);m[0]+=p[0];m[1]+=p[1];m[2]+=p[2];}
      const w=b-a,dd=Math.hypot(m[0]/w-ref[0],m[1]/w-ref[1],m[2]/w-ref[2]);
      if(dd>50){if(++miss>=2){stop=(y+1)/G;break;}}else miss=0;}
    res[name]=stop;}
  return res;}
function obstacle(fs,now){
  const fhn=F*Math.max(vid.videoWidth,vid.videoHeight)/vid.videoHeight;let best=null;
  for(const k of ['정면','왼쪽','오른쪽']){const y=fs[k];if(y==null||y<=.52)continue;const dist=CAMH*fhn/(y-.5);
    if(dist<2.5&&(!best||dist<best.d))best={k,d:dist};}
  if(best&&best.k==='정면')obsCnt++;else obsCnt=0;  // 3프레임 연속일 때만 (오경보 줄이기)
  if(best&&best.k==='정면'&&obsCnt>=3){
    if(best.d<1.3){if(thr('ob',now,2500))alertNow('멈추세요. 정면에 장애물이 있습니다');}
    else if(thr('ob2',now,3500))say(`정면 약 ${Math.round(best.d)}미터 앞에 장애물이 있습니다`);}
  else if(best&&best.k!=='정면'&&thr('ob'+best.k,now,4000))say(`${best.k} 약 ${Math.round(best.d)}미터 앞에 장애물이 있습니다`);
}

// ---------- 실행 ----------
async function loop(){
  cx.drawImage(vid,0,0,S,S);const d=cx.getImageData(0,0,S,S).data,n=S*S,a=new Float32Array(3*n);
  for(let i=0;i<n;i++){a[i]=d[4*i]/255;a[n+i]=d[4*i+1]/255;a[2*n+i]=d[4*i+2]/255;}
  const r=await sess.run({[sess.inputNames[0]]:new ort.Tensor('float32',a,[1,3,S,S])}),o=r[sess.outputNames[0]];
  const dets=decode(o.data,o.dims);draw(dets);const t0=performance.now();guard(dets,t0);obstacle(freeSpace(d),t0);requestAnimationFrame(loop);}
$('b').onclick=async()=>{
  $('b').hidden=true;actx=new (window.AudioContext||window.webkitAudioContext)();speak('모델을 불러오는 중입니다');
  try{ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/';ort.env.wasm.numThreads=1;
    sess=await ort.InferenceSession.create('yolov8n.onnx',{executionProviders:['wasm']});
    vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640}},audio:false});
    await vid.play();try{await navigator.wakeLock.request('screen');}catch(e){}
    speak('안내를 시작합니다');loop();
  }catch(e){speak('오류가 발생했습니다');st.textContent='오류: '+e.message;}};
</script></body></html>
