<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes">
<title>SpaceAudio 보행 보조 (실험용)</title>
<style>
body{margin:0;background:#111;color:#fff;font:18px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#stage{position:relative;margin:8px 0}video,canvas{width:100%;display:block;border-radius:8px;background:#222}
canvas{position:absolute;inset:0;background:none}
button,.btn{display:block;box-sizing:border-box;text-align:center;width:100%;min-height:60px;font-size:20px;font-weight:700;border:0;border-radius:12px;margin:6px 0;background:#444;color:#fff;line-height:60px}
#go{background:#2d7ff9;font-size:24px;min-height:72px}#go.on{background:#d33}
#quiz{display:none;grid-template-columns:repeat(4,1fr);gap:6px}#quiz button{min-height:56px;margin:0;line-height:1}
#status{min-height:3em;font-size:15px}.warn{font-size:13px;color:#fb4}details{margin:8px 0}summary{min-height:44px;line-height:44px}
</style></head><body><main>
<div id="stage"><video id="v" playsinline muted></video><canvas id="o" width="256" height="192"></canvas></div>
<p id="status" role="status" aria-live="polite">대기 중</p>
<button id="go" aria-label="보조 기능 시작">보조 시작</button>
<details><summary>설정 · 테스트</summary>
<button id="test">3D 소리 테스트 (시계 방향 순회)</button>
<button id="qz">방향 인식 퀴즈</button><div id="quiz"></div>
<button id="flip">카메라 전환</button>
<label class="btn">녹화 영상으로 테스트<input id="file" type="file" accept="video/*" hidden></label>
<button id="log">로그 CSV 저장</button></details>
<p class="warn">실험용 프로토타입입니다. 백색지팡이·안내견을 대체하지 않으며 안전이 검증되지 않았습니다. 이어폰(개방형/골전도 권장)을 사용하세요.</p>
</main><script type="module" src="app.js"></script></body></html>
